# Manually clean up old beta releases (and their tags), keeping the newest one.
# Stable releases are never touched.
name: Delete Beta Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_prerelease_only: true
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
